<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slides da Portaria</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #slide {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <img id="slide" alt="Apresentação de imagens">

  <script>
    const imagens = [
      "slide1.jpg",
      "slide2.jpg",
      "slide3.jpg",
      "slide4.jpg",
      "slide5.jpg",
      "slide6.jpg",
      "slide7.jpg",
      "slide8.jpg"
    ];

    let atual = 0;
    const slide = document.getElementById("slide");

    function mostrarSlide() {
      slide.src = imagens[atual];
    }

    function proximo() {
      atual = (atual + 1) % imagens.length;
      mostrarSlide();
    }

    mostrarSlide();
    setInterval(proximo, 8000);
  </script>
</body>
</html>
